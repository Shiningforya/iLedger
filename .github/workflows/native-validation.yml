name: Native candidate validation
on:
  workflow_dispatch:
  pull_request:
    paths: ['native/**', 'scripts/native/**', '.github/workflows/native-validation.yml']
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: node scripts/native/setup.mjs --mac-model-engines
      - run: node scripts/native/build-macos.mjs
      - run: node native/core/tests/accounting.test.mjs
      - run: ditto -c -k --keepParent 'native/.build/iLedger Native.app' native/.build/iLedger-native-candidate.zip
      - uses: actions/upload-artifact@v4
        with: { name: macos-native-candidate, path: native/.build/iLedger-native-candidate.zip }
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - run: node scripts/native/setup.mjs
      - run: node scripts/native/prepare-platforms.mjs
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
      - run: bash native/android/gradlew -p native/android --no-daemon assembleDebug assembleDebugAndroidTest lintDebug
      - uses: actions/upload-artifact@v4
        with: { name: android-native-candidate, path: native/android/app/build/outputs/apk/debug/*.apk }
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - run: npm ci
      - run: node scripts/native/setup.mjs
      - run: node scripts/native/prepare-platforms.mjs
      - shell: pwsh
        run: ./scripts/native/build-windows.ps1
      - run: node native/core/tests/accounting.test.mjs
        env: { ILEDGER_CORE_BIN: native/.build/windows-core/Release/iledger-core.exe }
      - uses: actions/upload-artifact@v4
        with: { name: windows-native-candidate, path: native/.build/windows-app/ }
